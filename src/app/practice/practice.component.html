<div class="row" >

    <div class="col-xs-12">
        <p *ngFor="let fruit of tryArray, let i=index">
            {{i}}-{{fruit}}</p>
            <input type="text" [(ngModel)]="fruitName">
           <div>
            {{fruitName}}

           </div> 
        </div>
        <button class="addingList" (click)="onAddInList()">Add in List</button>
        <button class="deletingList" (click)="onDelInList()">Delete</button>

</div>
